<system>
  log_level debug
</system>

<source>
  @type forward
  bind 0.0.0.0
  port 22424
</source>

<source>
  @type forward
  bind 0.0.0.0
  port 22425
</source>

<label @FLUENT_LOG>
  <match **>
    @type null
  </match>
</label>

<filter windows.winevtlog>
  @type ecs_normalizer
</filter>

<filter linux.systemd>
  @type ecs_normalizer
</filter>

<filter linux.syslog.system>
  @type ecs_normalizer
</filter>

<match **>
  @type http
  endpoint_url http://victoria-logs:9428/insert/jsonline?_msg_field=message&_time_field=time
  http_method post
  serializer json
  bulk_request true

  <buffer>
    @type memory
    flush_interval 1s
    flush_mode interval
  </buffer>
</match>
