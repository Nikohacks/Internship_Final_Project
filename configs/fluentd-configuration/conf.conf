<system>
  log_level debug
</system>

<source>
  @type forward
  bind 0.0.0.0
  port 22424
</source>

<source>
  @type forward
  bind  0.0.0.0
  port  22425
</source>

<label @FLUENT_LOG>
  <match **>
    @type null
  </match>
</label>

<filter windows.winevtlog>
  @type ecs_normalizer
</filter>

<filter linux.systemd>
  @type ecs_normalizer
</filter>

<filter linux.syslog.system>
  @type ecs_normalizer
</filter>

<match **>
  @type http
  endpoint  "#{ENV['VICTORIA_LOGS_URL'] || 'http://host.docker.internal:9428'}/insert/jsonline?_msg_field=Message,MESSAGE,log,message,rendered_text&_time_field=time"
  <format>
    @type json
    include_time_key true
    time_key time
    time_format %Y-%m-%dT%H:%M:%S.%N%:z
  </format>
  <buffer>
    @type memory
    flush_interval 1s
  </buffer>
</match>