  - alert: Potential_AS_REP_Roasting_via_Kerberos_TGT_Requests
    expr: event.code:=4768 AND TicketEncryptionType:="0x17" AND ServiceName:="krbtgt"
      AND PreAuthType:=0 | stats count() as matches | filter matches:>0
    for: 0s
    labels:
