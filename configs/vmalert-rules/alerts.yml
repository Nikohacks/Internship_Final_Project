groups:
- name: Sigma rules
  type: vlogs
  interval: 10s
  rules:
  - alert: Azure_AD_Health_Monitoring_Agent_Registry_Keys_Access
    expr: (event.code:in(4656, 4663)) AND ObjectType:="Key" AND ObjectName:="\\REGISTRY\\MACHINE\\SOFTWARE\\Microsoft\\Microsoft
      Online\\Reporting\\MonitoringAgent" AND NOT (ProcessName:"Microsoft.Identity.Health.Adfs.DiagnosticsAgent.exe"
      OR ProcessName:"Microsoft.Identity.Health.Adfs.InsightsService.exe" OR ProcessName:"Microsoft.Identity.Health.Adfs.MonitoringAgent.Startup.exe"
      OR ProcessName:"Microsoft.Identity.Health.Adfs.PshSurrogate.exe" OR ProcessName:"Microsoft.Identity.Health.Common.Clients.ResourceMonitor.exe")
      | stats count() as matches | filter matches:>0
    for: 0s
    labels:
      severity: medium
      sigma_id: ff151c33-45fa-475d-af4f-c2f93571f4fe
    annotations:
      summary: Azure AD Health Monitoring Agent Registry Keys Access
      description: 'This detection uses Windows security events to detect suspicious
        access attempts to the registry key of Azure AD Health monitoring agent.

        This detection requires an access control entry (ACE) on the system access
        control list (SACL) of the following securable object HKLM\SOFTWARE\Microsoft\Microsoft
        Online\Reporting\MonitoringAgent.

        '
      author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), MSTIC
      tags: attack.discovery, attack.t1012
      references: 'https://o365blog.com/post/hybridhealthagent/

        https://github.com/OTRF/Set-AuditRule/blob/c3dec5443414231714d850565d364ca73475ade5/rules/registry/aad_connect_health_monitoring_agent.yml'
  - alert: Azure_AD_Health_Service_Agents_Registry_Keys_Access
    expr: (event.code:in(4656, 4663)) AND ObjectType:="Key" AND ObjectName:="\\REGISTRY\\MACHINE\\SOFTWARE\\Microsoft\\ADHealthAgent"
      AND NOT (ProcessName:"Microsoft.Identity.Health.Adfs.DiagnosticsAgent.exe" OR
      ProcessName:"Microsoft.Identity.Health.Adfs.InsightsService.exe" OR ProcessName:"Microsoft.Identity.Health.Adfs.MonitoringAgent.Startup.exe"
      OR ProcessName:"Microsoft.Identity.Health.Adfs.PshSurrogate.exe" OR ProcessName:"Microsoft.Identity.Health.Common.Clients.ResourceMonitor.exe")
      | stats count() as matches | filter matches:>0
    for: 0s
    labels:
      severity: medium
      sigma_id: 1d2ab8ac-1a01-423b-9c39-001510eae8e8
    annotations:
      summary: Azure AD Health Service Agents Registry Keys Access
      description: 'This detection uses Windows security events to detect suspicious
        access attempts to the registry key values and sub-keys of Azure AD Health
        service agents (e.g AD FS).

        Information from AD Health service agents can be used to potentially abuse
        some of the features provided by those services in the cloud (e.g. Federation).

        This detection requires an access control entry (ACE) on the system access
        control list (SACL) of the following securable object: HKLM:\SOFTWARE\Microsoft\ADHealthAgent.

        Make sure you set the SACL to propagate to its sub-keys.

        '
      author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), MSTIC
      tags: attack.discovery, attack.t1012
      references: 'https://o365blog.com/post/hybridhealthagent/

        https://github.com/OTRF/Set-AuditRule/blob/c3dec5443414231714d850565d364ca73475ade5/rules/registry/aad_connect_health_service_agent.yml'
  - alert: Powerview_Add_DomainObjectAcl_DCSync_AD_Extend_Right
    expr: event.code:=5136 AND AttributeLDAPDisplayName:="ntSecurityDescriptor" AND
      (AttributeValue:"1131f6ad-9c07-11d1-f79f-00c04fc2dcd2" OR AttributeValue:"1131f6aa-9c07-11d1-f79f-00c04fc2dcd2"
      OR AttributeValue:"89e95b76-444d-4c62-991a-0facbeda640c") AND NOT (ObjectClass:in("dnsNode",
      "dnsZoneScope", "dnsZone")) | stats count() as matches | filter matches:>0
    for: 0s
    labels:
      severity: high
      sigma_id: 2c99737c-585d-4431-b61a-c911d86ff32f
    annotations:
      summary: Powerview Add-DomainObjectAcl DCSync AD Extend Right
      description: Backdooring domain object to grant the rights associated with DCSync
        to a regular user or machine account using Powerview\Add-DomainObjectAcl DCSync
        Extended Right cmdlet, will allow to re-obtain the pwd hashes of any user/computer
      author: Samir Bousseaden, Roberto Rodriguez @Cyb3rWard0g, oscd.community, Tim
        Shelton, Maxence Fossat
      tags: attack.privilege-escalation, attack.persistence, attack.t1098
      references: 'https://twitter.com/menasec1/status/1111556090137903104

        https://www.specterops.io/assets/resources/an_ace_up_the_sleeve.pdf'
  - alert: AD_Privileged_Users_or_Groups_Reconnaissance
    expr: event.code:=4661 AND (ObjectType:in("SAM_USER", "SAM_GROUP")) AND (ObjectName:~"-512$"
      OR ObjectName:~"-502$" OR ObjectName:~"-500$" OR ObjectName:~"-505$" OR ObjectName:~"-519$"
      OR ObjectName:~"-520$" OR ObjectName:~"-544$" OR ObjectName:~"-551$" OR ObjectName:~"-555$"
      OR ObjectName:"admin") AND NOT user.name:~"\\$$" | stats count() as matches
      | filter matches:>0
    for: 0s
    labels:
      severity: high
      sigma_id: 35ba1d85-724d-42a3-889f-2e2362bcaf23
    annotations:
      summary: AD Privileged Users or Groups Reconnaissance
      description: Detect priv users or groups recon based on 4661 eventid and known
        privileged users or groups SIDs
      author: Samir Bousseaden
      tags: attack.discovery, attack.t1087.002
      references: https://web.archive.org/web/20230329163438/https://blog.menasec.net/2019/02/threat-hunting-5-detecting-enumeration.html
  - alert: ADCS_Certificate_Template_Configuration_Vulnerability_with_Risky_EKU
    expr: event.code:=4898 AND (TemplateContent:"1.3.6.1.5.5.7.3.2" OR TemplateContent:"1.3.6.1.5.2.3.4"
      OR TemplateContent:"1.3.6.1.4.1.311.20.2.2" OR TemplateContent:"2.5.29.37.0")
      AND TemplateContent:"CT_FLAG_ENROLLEE_SUPPLIES_SUBJECT" OR event.code:=4899
      AND (NewTemplateContent:"1.3.6.1.5.5.7.3.2" OR NewTemplateContent:"1.3.6.1.5.2.3.4"
      OR NewTemplateContent:"1.3.6.1.4.1.311.20.2.2" OR NewTemplateContent:"2.5.29.37.0")
      AND NewTemplateContent:"CT_FLAG_ENROLLEE_SUPPLIES_SUBJECT" | stats count() as
      matches | filter matches:>0
    for: 0s
    labels:
      severity: high
      sigma_id: bfbd3291-de87-4b7c-88a2-d6a5deb28668
    annotations:
      summary: ADCS Certificate Template Configuration Vulnerability with Risky EKU
      description: Detects certificate creation with template allowing risk permission
        subject and risky EKU
      author: Orlinum , BlueDefenZer
      tags: attack.privilege-escalation, attack.credential-access
      references: https://www.specterops.io/assets/resources/Certified_Pre-Owned.pdf
  - alert: AD_Object_WriteDAC_Access
    expr: event.code:=4662 AND ObjectServer:="DS" AND AccessMask:="0x40000" AND (ObjectType:in("19195a5b-6da0-11d0-afd3-00c04fd930c9",
      "domainDNS")) | stats count() as matches | filter matches:>0
    for: 0s
    labels:
      severity: critical
      sigma_id: 028c7842-4243-41cd-be6f-12f3cf1a26c7
    annotations:
      summary: AD Object WriteDAC Access
      description: Detects WRITE_DAC access to a domain object
      author: Roberto Rodriguez @Cyb3rWard0g
      tags: attack.defense-impairment, attack.t1222.001
      references: 'https://threathunterplaybook.com/hunts/windows/180815-ADObjectAccessReplication/notebook.html

        https://threathunterplaybook.com/library/windows/active_directory_replication.html

        https://threathunterplaybook.com/hunts/windows/190101-ADModDirectoryReplication/notebook.html'
  - alert: Active_Directory_Replication_from_Non_Machine_Account
    expr: event.code:=4662 AND AccessMask:="0x100" AND (Properties:"1131f6aa-9c07-11d1-f79f-00c04fc2dcd2"
      OR Properties:"1131f6ad-9c07-11d1-f79f-00c04fc2dcd2" OR Properties:"89e95b76-444d-4c62-991a-0facbeda640c")
      AND NOT (user.name:~"\\$$" OR user.name:="MSOL_"*) | stats count() as matches
      | filter matches:>0
    for: 0s
    labels:
      severity: critical
      sigma_id: 17d619c1-e020-4347-957e-1d1207455c93
    annotations:
      summary: Active Directory Replication from Non Machine Account
      description: Detects potential abuse of Active Directory Replication Service
        (ADRS) from a non machine account to request credentials.
      author: Roberto Rodriguez @Cyb3rWard0g
      tags: attack.credential-access, attack.t1003.006
      references: 'https://threathunterplaybook.com/hunts/windows/180815-ADObjectAccessReplication/notebook.html

        https://threathunterplaybook.com/library/windows/active_directory_replication.html

        https://threathunterplaybook.com/hunts/windows/190101-ADModDirectoryReplication/notebook.html'
  - alert: Potential_AD_User_Enumeration_From_Non_Machine_Account
    expr: event.code:=4662 AND ObjectType:"bf967aba-0de6-11d0-a285-00aa003049e2" AND
      (AccessMask:~".*1." OR AccessMask:~".*3." OR AccessMask:~".*4." OR AccessMask:~".*7."
      OR AccessMask:~".*9." OR AccessMask:~".*B." OR AccessMask:~".*D." OR AccessMask:~".*F.")
      AND NOT (user.name:~"\\$$" OR user.name:="MSOL_"*) | stats count() as matches
      | filter matches:>0
    for: 0s
    labels:
      severity: medium
      sigma_id: ab6bffca-beff-4baa-af11-6733f296d57a
    annotations:
      summary: Potential AD User Enumeration From Non-Machine Account
      description: Detects read access to a domain user from a non-machine account
      author: Maxime Thiebaut (@0xThiebaut)
      tags: attack.discovery, attack.t1087.002
      references: 'https://www.specterops.io/assets/resources/an_ace_up_the_sleeve.pdf

        http://www.stuffithoughtiknew.com/2019/02/detecting-bloodhound.html

        https://learn.microsoft.com/en-us/windows/win32/adschema/attributes-all

        https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4662'
  - alert: Enabled_User_Right_in_AD_to_Control_User_Objects
    expr: event.code:=4704 AND PrivilegeList:"SeEnableDelegationPrivilege" | stats
      count() as matches | filter matches:>0
    for: 0s
    labels:
      severity: high
      sigma_id: 311b6ce2-7890-4383-a8c2-663a9f6b43cd
    annotations:
      summary: Enabled User Right in AD to Control User Objects
      description: Detects scenario where if a user is assigned the SeEnableDelegationPrivilege
        right in Active Directory it would allow control of other AD user objects.
      author: '@neu5ron'
      tags: attack.privilege-escalation, attack.persistence, attack.t1098
      references: https://blog.harmj0y.net/activedirectory/the-most-dangerous-user-right-you-probably-have-never-heard-of/
  - alert: Active_Directory_User_Backdoors
    expr: event.code:=4738 AND NOT (AllowedToDelegateTo:in("", "-") OR AllowedToDelegateTo:"")
      OR event.code:=5136 AND AttributeLDAPDisplayName:="msDS-AllowedToDelegateTo"
      OR event.code:=5136 AND ObjectClass:="user" AND AttributeLDAPDisplayName:="servicePrincipalName"
      OR event.code:=5136 AND AttributeLDAPDisplayName:="msDS-AllowedToActOnBehalfOfOtherIdentity"
      | stats count() as matches | filter matches:>0
    for: 0s
    labels:
      severity: high
      sigma_id: 300bac00-e041-4ee2-9c36-e262656a6ecc
    annotations:
      summary: Active Directory User Backdoors
      description: Detects scenarios where one can control another users or computers
        account without having to use their credentials.
      author: '@neu5ron'
      tags: attack.privilege-escalation, attack.t1098, attack.persistence
      references: 'https://msdn.microsoft.com/en-us/library/cc220234.aspx

        https://adsecurity.org/?p=3466

        https://blog.harmj0y.net/redteaming/another-word-on-delegation/'
  - alert: Weak_Encryption_Enabled_and_Kerberoast
    expr: event.code:=4738 AND ((NewUacValue:~".*8..." OR NewUacValue:~".*9..." OR
      NewUacValue:~".*A..." OR NewUacValue:~".*B..." OR NewUacValue:~".*C..." OR NewUacValue:~".*D..."
      OR NewUacValue:~".*E..." OR NewUacValue:~".*F...") AND NOT (OldUacValue:~".*8..."
      OR OldUacValue:~".*9..." OR OldUacValue:~".*A..." OR OldUacValue:~".*B..." OR
      OldUacValue:~".*C..." OR OldUacValue:~".*D..." OR OldUacValue:~".*E..." OR OldUacValue:~".*F...")
      OR (NewUacValue:~".*1...." OR NewUacValue:~".*3...." OR NewUacValue:~".*5...."
      OR NewUacValue:~".*7...." OR NewUacValue:~".*9...." OR NewUacValue:~".*B...."
      OR NewUacValue:~".*D...." OR NewUacValue:~".*F....") AND NOT (OldUacValue:~".*1...."
      OR OldUacValue:~".*3...." OR OldUacValue:~".*5...." OR OldUacValue:~".*7...."
      OR OldUacValue:~".*9...." OR OldUacValue:~".*B...." OR OldUacValue:~".*D...."
      OR OldUacValue:~".*F....") OR (NewUacValue:~".*8.." OR NewUacValue:~".*9.."
      OR NewUacValue:~".*A.." OR NewUacValue:~".*B.." OR NewUacValue:~".*C.." OR NewUacValue:~".*D.."
      OR NewUacValue:~".*E.." OR NewUacValue:~".*F..") AND NOT (OldUacValue:~".*8.."
      OR OldUacValue:~".*9.." OR OldUacValue:~".*A.." OR OldUacValue:~".*B.." OR OldUacValue:~".*C.."
      OR OldUacValue:~".*D.." OR OldUacValue:~".*E.." OR OldUacValue:~".*F..")) |
      stats count() as matches | filter matches:>0
    for: 0s
    labels:
      severity: high
      sigma_id: f6de9536-0441-4b3f-a646-f4e00f300ffd
    annotations:
      summary: Weak Encryption Enabled and Kerberoast
      description: Detects scenario where weak encryption is enabled for a user profile
        which could be used for hash/password cracking.
      author: '@neu5ron'
      tags: attack.defense-impairment, attack.t1685
      references: 'https://adsecurity.org/?p=2053

        https://blog.harmj0y.net/redteaming/another-word-on-delegation/'
  - alert: Hacktool_Ruler
    expr: event.code:=4776 AND Workstation:="RULER" OR (event.code:in(4624, 4625))
      AND WorkstationName:="RULER" | stats count() as matches | filter matches:>0
    for: 0s
    labels:
      severity: high
      sigma_id: 24549159-ac1b-479c-8175-d42aea947cae
    annotations:
      summary: Hacktool Ruler
      description: This events that are generated when using the hacktool Ruler by
        Sensepost
      author: Florian Roth (Nextron Systems)
      tags: attack.discovery, attack.execution, attack.collection, attack.lateral-movement,
        attack.t1087, attack.t1114, attack.t1059, attack.t1550.002
      references: 'https://github.com/sensepost/ruler

        https://github.com/sensepost/ruler/issues/47

        https://github.com/staaldraad/go-ntlm/blob/cd032d41aa8ce5751c07cb7945400c0f5c81e2eb/ntlm/ntlmv1.go#L427

        https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4776

        https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4624'
  - alert: Remote_Task_Creation_via_ATSVC_Named_Pipe
    expr: event.code:=5145 AND ShareName:="\\\\*\\IPC$" AND RelativeTargetName:="atsvc"
      AND AccessList:"WriteData" | stats count() as matches | filter matches:>0
    for: 0s
    labels:
      severity: medium
      sigma_id: f6de6525-4509-495a-8a82-1f8b0ed73a00
    annotations:
      summary: Remote Task Creation via ATSVC Named Pipe
      description: Detects remote task creation via at.exe or API interacting with
        ATSVC namedpipe
      author: Samir Bousseaden
      tags: attack.privilege-escalation, attack.execution, attack.lateral-movement,
        attack.persistence, car.2013-05-004, car.2015-04-001, attack.t1053.002
      references: https://web.archive.org/web/20230409194125/https://blog.menasec.net/2019/03/threat-hunting-25-scheduled-tasks-for.html
  - alert: Security_Eventlog_Cleared
    expr: event.code:=517 AND Provider_Name:="Security" OR event.code:=1102 AND Provider_Name:="Microsoft-Windows-Eventlog"
      | stats count() as matches | filter matches:>0
    for: 0s
    labels:
      severity: high
      sigma_id: d99b79d2-0a6f-4f46-ad8b-260b6e17f982
    annotations:
      summary: Security Eventlog Cleared
      description: One of the Windows Eventlogs has been cleared. e.g. caused by "wevtutil
        cl" command execution
      author: Florian Roth (Nextron Systems)
      tags: attack.defense-impairment, attack.t1685.005, car.2016-04-002
      references: 'https://twitter.com/deviouspolack/status/832535435960209408

        https://www.hybrid-analysis.com/sample/027cc450ef5f8c5f653329641ec1fed91f694e0d229928963b30f6b0d7d3a745?environmentId=100

        https://github.com/Azure/Azure-Sentinel/blob/f99542b94afe0ad2f19a82cc08262e7ac8e1428e/Detections/SecurityEvent/SecurityEventLogCleared.yaml'
  - alert: Processes_Accessing_the_Microphone_and_Webcam
    expr: (event.code:in(4657, 4656, 4663)) AND (ObjectName:"\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\CapabilityAccessManager\\ConsentStore\\microphone\\NonPackaged"
      OR ObjectName:"\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\CapabilityAccessManager\\ConsentStore\\webcam\\NonPackaged")
      | stats count() as matches | filter matches:>0
    for: 0s
    labels:
      severity: medium
      sigma_id: 8cd538a4-62d5-4e83-810b-12d41e428d6e
    annotations:
      summary: Processes Accessing the Microphone and Webcam
      description: Potential adversaries accessing the microphone and webcam in an
        endpoint.
      author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
      tags: attack.collection, attack.t1123
      references: 'https://twitter.com/duzvik/status/1269671601852813320

        https://medium.com/@7a616368/can-you-track-processes-accessing-the-camera-and-microphone-7e6885b37072'
  - alert: CobaltStrike_Service_Installations_Security
    expr: event.code:=4697 AND (ServiceFileName:"ADMIN$" AND ServiceFileName:".exe"
      OR ServiceFileName:"%COMSPEC%" AND ServiceFileName:"start" AND ServiceFileName:"powershell"
      OR ServiceFileName:"powershell -nop -w hidden -encodedcommand" OR ServiceFileName:"SUVYIChOZXctT2JqZWN0IE5ldC5XZWJjbGllbnQpLkRvd25sb2FkU3RyaW5nKCdodHRwOi8vMTI3LjAuMC4xO"
      OR ServiceFileName:"lFWCAoTmV3LU9iamVjdCBOZXQuV2ViY2xpZW50KS5Eb3dubG9hZFN0cmluZygnaHR0cDovLzEyNy4wLjAuMT"
      OR ServiceFileName:"JRVggKE5ldy1PYmplY3QgTmV0LldlYmNsaWVudCkuRG93bmxvYWRTdHJpbmcoJ2h0dHA6Ly8xMjcuMC4wLjE6")
      | stats count() as matches | filter matches:>0
    for: 0s
    labels:
      severity: high
      sigma_id: d7a95147-145f-4678-b85d-d1ff4a3bb3f6
    annotations:
      summary: CobaltStrike Service Installations - Security
      description: Detects known malicious service installs that appear in cases in
        which a Cobalt Strike beacon elevates privileges or lateral movement
      author: Florian Roth (Nextron Systems), Wojciech Lesicki
      tags: attack.persistence, attack.execution, attack.privilege-escalation, attack.lateral-movement,
        attack.t1021.002, attack.t1543.003, attack.t1569.002
      references: 'https://www.sans.org/webcasts/119395

        https://www.crowdstrike.com/blog/getting-the-bacon-from-cobalt-strike-beacon/

        https://thedfirreport.com/2021/08/29/cobalt-strike-a-defenders-guide/'
  - alert: DCERPC_SMB_Spoolss_Named_Pipe
    expr: event.code:=5145 AND ShareName:="\\\\*\\IPC$" AND RelativeTargetName:="spoolss"
      | stats count() as matches | filter matches:>0
    for: 0s
    labels:
      severity: medium
      sigma_id: 214e8f95-100a-4e04-bb31-ef6cba8ce07e
    annotations:
      summary: DCERPC SMB Spoolss Named Pipe
      description: Detects the use of the spoolss named pipe over SMB. This can be
        used to trigger the authentication via NTLM of any machine that has the spoolservice
        enabled.
      author: OTR (Open Threat Research)
      tags: attack.lateral-movement, attack.t1021.002
      references: 'https://posts.specterops.io/hunting-in-active-directory-unconstrained-delegation-forests-trusts-71f2b33688e1

        https://dirkjanm.io/a-different-way-of-abusing-zerologon/

        https://twitter.com/_dirkjan/status/1309214379003588608'
  - alert: DCOM_InternetExplorer_Application_Iertutil_DLL_Hijack_Security
    expr: event.code:=5145 AND RelativeTargetName:~"\\\\Internet Explorer\\\\iertutil\\.dll$"
      AND NOT user.name:~"\\$$" | stats count() as matches | filter matches:>0
    for: 0s
    labels:
      severity: high
      sigma_id: c39f0c81-7348-4965-ab27-2fde35a1b641
    annotations:
      summary: DCOM InternetExplorer.Application Iertutil DLL Hijack - Security
      description: Detects a threat actor creating a file named `iertutil.dll` in
        the `C:\Program Files\Internet Explorer\` directory over the network for a
        DCOM InternetExplorer DLL Hijack scenario.
      author: Roberto Rodriguez @Cyb3rWard0g, Open Threat Research (OTR)
      tags: attack.lateral-movement, attack.t1021.002, attack.t1021.003
      references: https://threathunterplaybook.com/hunts/windows/201009-RemoteDCOMIErtUtilDLLHijack/notebook.html
  - alert: Mimikatz_DC_Sync
    expr: event.code:=4662 AND (Properties:"Replicating Directory Changes All" OR
      Properties:"1131f6ad-9c07-11d1-f79f-00c04fc2dcd2" OR Properties:"1131f6aa-9c07-11d1-f79f-00c04fc2dcd2"
      OR Properties:"9923a32a-3607-11d2-b9be-0000f87a36b2" OR Properties:"89e95b76-444d-4c62-991a-0facbeda640c")
      AND AccessMask:="0x100" AND NOT (SubjectDomainName:="Window Manager" OR user.name:="NT
      AUT"* OR user.name:="MSOL_"* OR user.name:~"\\$$") | stats count() as matches
      | filter matches:>0
    for: 0s
    labels:
      severity: high
      sigma_id: 611eab06-a145-4dfa-a295-3ccc5c20f59a
    annotations:
      summary: Mimikatz DC Sync
      description: Detects Mimikatz DC sync security events
      author: Benjamin Delpy, Florian Roth (Nextron Systems), Scott Dermott, Sorina
        Ionescu
      tags: attack.credential-access, attack.s0002, attack.t1003.006
      references: 'https://twitter.com/gentilkiwi/status/1003236624925413376

        https://gist.github.com/gentilkiwi/dcc132457408cf11ad2061340dcb53c2

        https://blog.blacklanternsecurity.com/p/detecting-dcsync?s=r

        https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4662'
  - alert: Windows_Default_Domain_GPO_Modification
    expr: event.code:=5136 AND ObjectClass:="groupPolicyContainer" AND (ObjectDN:="CN={31B2F340-016D-11D2-945F-00C04FB984F9},CN=POLICIES,CN=SYSTEM"*
      OR ObjectDN:="CN={6AC1786C-016F-11D2-945F-00C04FB984F9},CN=POLICIES,CN=SYSTEM"*)
      | stats count() as matches | filter matches:>0
    for: 0s
    labels:
      severity: medium
      sigma_id: e5ac86dd-2da1-454b-be74-05d26c769d7d
    annotations:
      summary: Windows Default Domain GPO Modification
      description: 'Detects modifications to Default Domain or Default Domain Controllers
        Group Policy Objects (GPOs).

        Adversaries may modify these default GPOs to deploy malicious configurations
        across the domain.

        '
      author: Swachchhanda Shrawan Poudel (Nextron Systems)
