  - alert: Kerberoasting_Activity_Initial_Query
    expr: event.code:=4769 AND Status:="0x0" AND TicketEncryptionType:="0x17" AND
      NOT (ServiceName:~"krbtgt$" OR ServiceName:~"\\$$" OR user.target.name:"$@")
