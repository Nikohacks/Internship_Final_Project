  - alert: File_Access_Of_Signal_Desktop_Sensitive_Data
    expr: event.code:=4663 AND ObjectType:="File" AND ObjectName:"\\AppData\\Roaming\\Signal\\"
      AND (ObjectName:~"\\\\config\\.json$" OR ObjectName:~"\\\\db\\.sqlite$") AND
      NOT (ProcessName:~"\\\\signal-portable\\.exe$" OR ProcessName:~"\\\\signal\\.exe$")
      | stats count() as matches | filter matches:>0
    for: 0s
    labels:
      severity: medium
      sigma_id: 5d6c375a-18ae-4952-b4f6-8b803f6c8555
    annotations:
      summary: File Access Of Signal Desktop Sensitive Data
      description: 'Detects access to Signal Desktop''s sensitive data files: db.sqlite
        and config.json.

        The db.sqlite file in Signal Desktop stores all locally saved messages in
        an encrypted SQLite database, while the config.json contains the decryption
        key needed to access that data.

        Since the key is stored in plain text, a threat actor who gains access to
        both files can decrypt and read sensitive messages without needing the users
        credentials.

        Currently the rule only covers the default Signal installation path in AppData\Roaming.
        Signal Portable installations may use different paths based on user configuration.
        Additional paths can be added to the selection as needed.

        '
      author: Andreas Braathen (mnemonic.io)
      tags: attack.credential-access, attack.t1003
      references: 'https://cloud.google.com/blog/topics/threat-intelligence/russia-targeting-signal-messenger/

        https://vmois.dev/query-signal-desktop-messages-sqlite/'
