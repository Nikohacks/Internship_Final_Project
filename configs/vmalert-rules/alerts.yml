      "C:\\Windows\\ImmersiveControlPanel\\SystemSettings.exe", "C:\\Windows\\System32\\Dism.exe",
      "C:\\Windows\\System32\\fltMC.exe", "C:\\Windows\\System32\\mmc.exe", "C:\\Windows\\System32\\rundll32.exe",
      "C:\\Windows\\System32\\RuntimeBroker.exe", "C:\\Windows\\System32\\ShellHost.exe",
      "C:\\Windows\\System32\\svchost.exe", "C:\\Windows\\System32\\SystemSettingsBroker.exe",
      "C:\\Windows\\System32\\wimserv.exe") OR ProcessName:="C:\\Program Files\\WindowsApps\\Microsoft"*)
      AND NOT (ProcessName:~"\\\\AppData\\\\Local\\\\Microsoft\\\\Teams\\\\current\\\\Teams\\.exe$"
      OR ProcessName:~"\\\\Google\\\\Chrome\\\\Application\\\\chrome\\.exe$" OR ProcessName:~"\\\\procexp\\.exe$"
      OR ProcessName:~"\\\\procexp64\\.exe$" OR ProcessName:~"\\\\procexp64a\\.exe$"
      OR ProcessName:~"\\\\procmon\\.exe$" OR ProcessName:~"\\\\procmon64\\.exe$"
      OR ProcessName:~"\\\\procmon64a\\.exe$" OR (ProcessName:="C:\\Program Files
      (x86)\\Dropbox\\"* OR ProcessName:="C:\\Program Files\\Dropbox\\"*) AND ProcessName:~"\\\\Dropbox\\.exe$")
      | stats count() as matches | filter matches:>0
    for: 0s
    labels:
      severity: medium
      sigma_id: f63508a0-c809-4435-b3be-ed819394d612
    annotations:
      summary: Potential Privileged System Service Operation - SeLoadDriverPrivilege
      description: 'Detects the usage of the ''SeLoadDriverPrivilege'' privilege.
        This privilege is required to load or unload a device driver.

        With this privilege, the user can dynamically load and unload device drivers
        or other code in to kernel mode.

        This user right does not apply to Plug and Play device drivers.

        If you exclude privileged users/admins and processes, which are allowed to
        do so, you are maybe left with bad programs trying to load malicious kernel
        drivers.

        This will detect Ghost-In-The-Logs (https://github.com/bats3c/Ghost-In-The-Logs)
        and the usage of Sysinternals and various other tools. So you have to work
        with a whitelist to find the bad stuff.

        '
      author: xknow (@xknow_infosec), xorxes (@xor_xes)
      tags: attack.defense-impairment, attack.t1685
      references: 'https://web.archive.org/web/20230331181619/https://blog.dylan.codes/evading-sysmon-and-windows-event-logging/

        https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4673'
