  - alert: Potential_Kerberos_Coercion_by_Spoofing_SPNs_via_DNS_Manipulation
    expr: (event.code:in(5136, 5137)) AND ObjectClass:="dnsNode" AND ObjectDN:"UWhRCA"
      AND ObjectDN:"BAAAA" AND ObjectDN:"CN=MicrosoftDNS" OR event.code:=4662 AND
      AdditionalInfo:"UWhRCA" AND AdditionalInfo:"BAAAA" AND AdditionalInfo:"CN=MicrosoftDNS"
      | stats count() as matches | filter matches:>0
    for: 0s
    labels:
      severity: high
      sigma_id: b07e58cf-cacc-4135-8473-ccb2eba63dd2
    annotations:
      summary: Potential Kerberos Coercion by Spoofing SPNs via DNS Manipulation
      description: 'Detects modifications to DNS records in Active Directory where
        the Distinguished Name (DN) contains a base64-encoded blob

        matching the pattern "1UWhRCAAAAA...BAAAA". This pattern corresponds to a
        marshaled CREDENTIAL_TARGET_INFORMATION structure,

        commonly used in Kerberos coercion attacks. Adversaries may exploit this to
        coerce victim systems into authenticating to

        attacker-controlled hosts by spoofing SPNs via DNS. It is one of the strong
        indicators of a Kerberos coercion attack,.

        where adversaries manipulate DNS records to spoof Service Principal Names
        (SPNs) and redirect authentication requests like CVE-2025-33073.

        Please investigate the user account that made the changes, as it is likely
        a low-privileged account that has been compromised.

        '
      author: Swachchhanda Shrawan Poudel (Nextron Systems)
      tags: attack.collection, attack.credential-access, attack.t1557.003, attack.persistence,
        attack.privilege-escalation
      references: 'https://googleprojectzero.blogspot.com/2021/10/using-kerberos-for-authentication-relay.html

        https://www.synacktiv.com/publications/ntlm-reflection-is-dead-long-live-ntlm-reflection-an-in-depth-analysis-of-cve-2025'
