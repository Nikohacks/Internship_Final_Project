  - alert: Potential_Privilege_Escalation_via_Local_Kerberos_Relay_over_LDAP
    expr: event.code:=4624 AND winlog.logon.type:=3 AND AuthenticationPackageName:="Kerberos"
      AND source.ip:="127.0.0.1" AND TargetUserSid:="S-1-5-21-"* AND TargetUserSid:~"-500$"
      AND NOT IpPort:="0" | stats count() as matches | filter matches:>0
    for: 0s
    labels:
      severity: high
      sigma_id: 749c9f5e-b353-4b90-a9c1-05243357ca4b
    annotations:
      summary: Potential Privilege Escalation via Local Kerberos Relay over LDAP
      description: 'Detects a suspicious local successful logon event where the Logon
        Package is Kerberos, the remote address is set to localhost, and the target
        user SID is the built-in local Administrator account.

        This may indicate an attempt to leverage a Kerberos relay attack variant that
        can be used to elevate privilege locally from a domain joined limited user
        to local System privileges.

        '
